name: Build and deploy Merit Tracker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Verify public build configuration
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo "Repository variable SUPABASE_URL is required"; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "Repository variable SUPABASE_PUBLISHABLE_KEY is required"; exit 1; }

      - name: Install Flutter dependencies
        working-directory: apps/merit_app
        run: flutter pub get

      - name: Build Flutter Web
        working-directory: apps/merit_app
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: >-
          flutter build web --release
          --base-href "/${REPOSITORY_NAME}/"
          --dart-define=SUPABASE_URL="${SUPABASE_URL}"
          --dart-define=SUPABASE_PUBLISHABLE_KEY="${SUPABASE_PUBLISHABLE_KEY}"

      - name: Exclude public source maps
        shell: bash
        run: find apps/merit_app/build/web -type f -name '*.map' -delete

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: apps/merit_app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
