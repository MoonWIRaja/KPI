name: Verify Supabase Migration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3
        with:
          version: 3.0.0

      - name: Start isolated local Supabase stack
        run: supabase start

      - name: Apply all migrations to a clean local database
        run: supabase db reset --yes

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup
